<!--
  scanner.html — the ONLY file that needs a real HTTPS host (Netlify,
  GitHub Pages, Vercel, Firebase Hosting — any of them, all free).

  WHY THIS FILE EXISTS SEPARATELY FROM Scan.html:
  Google Apps Script serves HtmlService pages inside a sandboxed iframe
  on an opaque googleusercontent.com origin. Browsers categorically
  block camera access (getUserMedia) from opaque/sandboxed origins —
  this is enforced below the level of any permission prompt, so no
  setting fixes it from inside Apps Script. This page runs on a real,
  non-sandboxed HTTPS origin instead, where the camera works normally,
  and talks to your Apps Script backend over the network.

  HOW IT'S OPENED:
  Scan.html opens this page in a new tab with the currently-selected
  session attached as URL parameters, e.g.:
    https://your-host/scanner.html?session_id=SES-0004&session_label=...&token=...
  That keeps every scan tied to the exact session the teacher picked —
  a scan here can never land against the wrong session.

  SETUP (see README.md for full steps):
  1. Deploy your Apps Script project as a Web App, copy its /exec URL.
  2. Paste that URL into APPS_SCRIPT_URL below.
  3. Make sure SHARED_TOKEN below matches SHARED_TOKEN in Code.gs.
  4. Upload this single file to Netlify / GitHub Pages / Vercel.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Arial, sans-serif; background: #0f172a; color: white;
    min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .session-banner {
    width: 100%; max-width: 480px; background: #1e293b; border-radius: 10px;
    padding: 10px 14px; margin: 10px 0; font-size: 13px; color: #94a3b8; text-align: center;
  }
  .session-banner b { color: #22d3ee; }
  #reader { width: 100%; max-width: 480px; border-radius: 12px; overflow: hidden; margin: 10px 0; }
  .combo-wrap { width: 100%; max-width: 480px; position: relative; margin: 10px 0; }
  input[type=text] {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: none;
    background: #1e293b; color: white;
  }
  #comboResults { margin-top: 6px; max-height: 260px; overflow-y: auto; }
  .suggestion { padding: 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #1e293b; }
  .suggestion.cross-group { border-left: 4px solid #f59e0b; background: #3a2c14; }
  .s-name { font-weight: 600; }
  .s-code { font-size: 12px; color: #94a3b8; }
  .s-tag { font-size: 11px; font-weight: 700; color: #f59e0b; text-transform: uppercase; }
  .result-box {
    background: #1e293b; border: 2px solid #22d3ee; border-radius: 12px;
    padding: 15px 20px; margin: 10px 0; width: 100%; max-width: 480px; text-align: center;
  }
  .result-box.warn { border-color: #f59e0b; }
  .result-box.dup { border-color: #fbbf24; }
  .result-box.err { border-color: #f87171; }
  .result-box .who { font-size: 20px; font-weight: bold; margin: 6px 0; }
  .status { font-size: 14px; margin: 4px 0; color: #94a3b8; }
  .flag { color: #f59e0b; font-weight: 600; margin-top: 6px; font-size: 13px; }
  .history { width: 100%; max-width: 480px; margin-top: 16px; }
  .history h3 { margin-bottom: 8px; color: #94a3b8; font-size: 13px; }
  .history-item {
    background: #1e293b; padding: 10px 14px; border-radius: 8px; margin: 5px 0;
    display: flex; justify-content: space-between; font-size: 13px;
  }
  .back-link { margin-top: 20px; color: #64748b; font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <h1>📷 Attendance Scanner</h1>
  <div class="session-banner" id="sessionBanner">Loading session…</div>

  <div id="reader"></div>

  <div class="combo-wrap">
    <input type="text" id="studentCombo" placeholder="Or type a name / ID here..." autocomplete="off">
    <div id="comboResults"></div>
  </div>

  <div class="result-box" id="resultBox" style="display:none">
    <div class="who" id="whoText">--</div>
    <div class="status" id="statusText"></div>
  </div>

  <div class="history" id="historySection" style="display:none">
    <h3>Scanned this session</h3>
    <div id="historyList"></div>
  </div>

  <div class="back-link">Done scanning? Switch back to the Attendance tab to review and archive.</div>

<script>
  // ============ CONFIGURE THESE TWO VALUES ============
  const APPS_SCRIPT_URL = 'https://wickyanalytics.github.io/Farid-Barcode-Scanner/'; // paste your /exec URL
  const SHARED_TOKEN = 'change-this-token-123';                 // must match Code.gs SHARED_TOKEN
  // ======================================================

  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const sessionLabel = params.get('session_label') || '';
  const tokenFromUrl = params.get('token') || SHARED_TOKEN;

  const scanHistory = [];
  let lastScan = '';
  let lastScanTime = 0;
  let busy = false;

  document.getElementById('sessionBanner').innerHTML = sessionId
    ? `Scanning into: <b>${sessionLabel || sessionId}</b>`
    : `<span style="color:#f87171">No session_id in the URL — open this page from the Attendance app's "Open Barcode Scanner" button.</span>`;

  // beep on scan
  let audioCtx;
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = 1200; gain.gain.value = 0.25;
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  // ---- Apps Script call helper ----
  // Content-Type: text/plain avoids a CORS preflight (which Apps Script
  // can't answer), while still letting us read back a real JSON response
  // (unlike mode:'no-cors', which would make the response unreadable).
  async function callBackend(action, extra) {
    const payload = Object.assign({ action, token: tokenFromUrl }, extra);
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    return res.json();
  }

  // ---- barcode scan handling ----
  function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastScan && now - lastScanTime < 3000) return; // 3s debounce
    lastScan = decodedText;
    lastScanTime = now;
    beep();
    handleStudent(decodedText, 'Barcode');
  }

  async function handleStudent(studentId, method) {
    if (busy || !sessionId) return;
    busy = true;
    showResult('', 'Looking up…', '');
    try {
      const lookupRes = await callBackend('lookup', { student_id: studentId });
      if (!lookupRes.success || !lookupRes.data.found) {
        showResult('err', 'Not recognized', `No student matches "${studentId}".`);
        busy = false;
        return;
      }
      const info = lookupRes.data;
      const attRes = await callBackend('recordAttendance', {
        student_id: info.student_id, session_id: sessionId, entry_method: method,
      });
      if (!attRes.success) {
        showResult('err', 'Error', attRes.error || 'Could not save.');
        busy = false;
        return;
      }
      const result = attRes.data;
      if (result.status === 'duplicate') {
        showResult('dup', info.name, `Already recorded today at ${result.time}.`);
      } else if (result.status === 'error') {
        showResult('err', 'Could not save', result.message || 'Please try again.');
      } else {
        const cross = result.was_default ? '' : `<div class="flag">⚠️ Usual group is ${info.default_group_name} — recorded as a different session.</div>`;
        showResult(result.was_default ? '' : 'warn', result.student_name,
          `${result.delay_minutes > 0 ? '+' + result.delay_minutes + ' min late' : 'On time'} · ${result.courses_covered}${cross}`);
        scanHistory.unshift({ name: result.student_name, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        updateHistory();
      }
    } catch (err) {
      showResult('err', 'Network error', String(err));
    }
    busy = false;
  }

  function showResult(cls, who, status) {
    const box = document.getElementById('resultBox');
    box.className = 'result-box' + (cls ? ' ' + cls : '');
    box.style.display = 'block';
    document.getElementById('whoText').textContent = who;
    document.getElementById('statusText').innerHTML = status;
  }

  function updateHistory() {
    document.getElementById('historySection').style.display = 'block';
    document.getElementById('historyList').innerHTML = scanHistory.slice(0, 30).map(i =>
      `<div class="history-item"><span>${i.name}</span><span style="color:#64748b">${i.time}</span></div>`
    ).join('');
  }

  // ---- combined name/ID search (same backend logic as barcode path) ----
  const combo = document.getElementById('studentCombo');
  let searchTimer = null;
  combo.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSuggest(combo.value), 200);
  });
  combo.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && combo.value.trim()) {
      handleStudent(combo.value.trim(), 'Manual');
      combo.value = '';
      document.getElementById('comboResults').innerHTML = '';
    }
  });

  async function runSuggest(query) {
    if (!query || query.length < 1) { document.getElementById('comboResults').innerHTML = ''; return; }
    try {
      const groupId = params.get('group_id') || ''; // optional, only used for in-group highlighting
      const res = await callBackend('suggest', { query, group_id: groupId });
      if (res.success) renderSuggestions(res.data);
    } catch (e) {}
  }

  function renderSuggestions(list) {
    const box = document.getElementById('comboResults');
    if (!list.length) { box.innerHTML = ''; return; }
    box.innerHTML = list.map(s => `
      <div class="suggestion ${s.in_group ? '' : 'cross-group'}" onclick="pickStudent('${s.student_id}')">
        <div>
          <div class="s-name">${s.name}</div>
          <div class="s-code">${s.code} · ${s.student_id}</div>
        </div>
        ${s.in_group ? '' : '<div class="s-tag">Different group</div>'}
      </div>
    `).join('');
  }

  function pickStudent(studentId) {
    document.getElementById('comboResults').innerHTML = '';
    combo.value = '';
    handleStudent(studentId, 'Manual');
  }

  // ---- start camera (this works here because this page is a real
  //      top-level HTTPS origin, not the Apps Script sandboxed iframe) ----
  if (APPS_SCRIPT_URL.indexOf('YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') !== -1) {
    showResult('err', 'Not configured', 'Open this file and set APPS_SCRIPT_URL to your Apps Script Web App /exec URL — see README.md.');
  } else {
    const scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 150 } },
      onScanSuccess
    ).catch(err => {
      showResult('err', 'Camera error', String(err) + ' — check your phone browser\'s site settings allow camera access for this page.');
    });
  }
</script>
</body>
</html>
