<!--
  scanner.html (v4) — the ONLY file that lives outside Apps Script, on a real
  HTTPS host (GitHub Pages / Netlify / Vercel). Apps Script pages run inside a
  sandboxed iframe where browsers block the camera, so scanning happens here.

  Opened by App.html's "Open Barcode Scanner" with the session attached:
    ?session_id=SAT-G1-2026-09-12&session_label=...&group_id=SAT-G1&token=...&by=George
  Talks to Code.gs via doPost (Content-Type text/plain to dodge CORS preflight).

  SETUP: set APPS_SCRIPT_URL below to your /exec URL. SHARED_TOKEN is passed
  in the URL by the app (from the Settings tab); the constant here is only a
  fallback if the page is opened by hand.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Arial, sans-serif; background: #0f172a; color: white; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .banner, #reader, .combo, .box, .history, button.test { width: 100%; max-width: 480px; }
  .banner { background: #1e293b; border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 13px; color: #94a3b8; text-align: center; } .banner b { color: #22d3ee; }
  #reader { border-radius: 12px; overflow: hidden; margin: 10px 0; }
  .combo { position: relative; margin: 10px 0; }
  input { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: none; background: #1e293b; color: white; }
  #sug { margin-top: 6px; max-height: 260px; overflow-y: auto; }
  .s { padding: 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #1e293b; }
  .s.cross { border-left: 4px solid #f59e0b; background: #3a2c14; } .tag { font-size: 11px; font-weight: 700; color: #f59e0b; text-transform: uppercase; }
  .box { background: #1e293b; border: 2px solid #22d3ee; border-radius: 12px; padding: 15px 20px; margin: 10px 0; text-align: center; display: none; }
  .box.warn { border-color: #f59e0b; } .box.dup { border-color: #fbbf24; } .box.err { border-color: #f87171; }
  .who { font-size: 20px; font-weight: bold; margin: 6px 0; } .st { font-size: 14px; color: #94a3b8; } .flag { color: #f59e0b; font-weight: 600; margin-top: 6px; font-size: 13px; }
  .wa { display: inline-block; margin-top: 8px; background: #25d366; color: white; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
  .history { margin-top: 16px; } .history h3 { margin-bottom: 8px; color: #94a3b8; font-size: 13px; }
  .h { background: #1e293b; padding: 10px 14px; border-radius: 8px; margin: 5px 0; display: flex; justify-content: space-between; font-size: 13px; }
  button.test { padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 13px; }
  .foot { margin-top: 20px; color: #64748b; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<h1>📷 Attendance Scanner</h1>
<div class="banner" id="banner">Loading session…</div>
<button class="test" id="test">🔧 Test connection</button><div id="testOut" class="banner" style="display:none"></div>
<div id="reader"></div>
<div class="combo"><input id="combo" placeholder="Or type a name / ID…" autocomplete="off"><div id="sug"></div></div>
<div class="box" id="box"><div class="who" id="who">--</div><div class="st" id="st"></div><div id="waWrap"></div></div>
<div class="history" id="hist" style="display:none"><h3>Scanned this session</h3><div id="histList"></div></div>
<div class="foot">Done? Switch back to the Attendance tab, tap Refresh, then End Session &amp; Archive.</div>

<script>
// ============ CONFIGURE ============
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmcMsgLQbkT0R7pjlu6N25DRKlfXr35Mm1EwZBRmbzlYmm-ndEkrVu6zImPj861P10/exec';
const SHARED_TOKEN_FALLBACK = 'FaridAttendance2026Scanner';
// ===================================
const P = new URLSearchParams(location.search);
const sessionId = P.get('session_id'), sessionLabel = P.get('session_label') || '', groupId = P.get('group_id') || '';
const token = P.get('token') || SHARED_TOKEN_FALLBACK, by = P.get('by') || 'Scanner';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let history = [], lastScan = '', lastAt = 0, busy = false;

document.getElementById('banner').innerHTML = sessionId ? `Scanning into: <b>${esc(sessionLabel || sessionId)}</b><br><small>${esc(sessionId)}</small>`
  : '<span style="color:#f87171">No session in the URL — open this page from the Attendance app.</span>';

async function api(action, extra) {
  const r = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token }, extra)) });
  return r.json();
}
document.getElementById('test').onclick = async () => {
  const o = document.getElementById('testOut'); o.style.display = 'block'; o.textContent = 'Testing…';
  try { const r = await fetch(APPS_SCRIPT_URL + '?ping=1'); const j = await r.json(); o.innerHTML = j.success ? '<span style="color:#4ade80">✅ Reachable. If scans still fail, check SHARED_TOKEN in the Settings tab.</span>' : '⚠️ Unexpected reply'; }
  catch (e) { o.innerHTML = `<span style="color:#f87171">❌ ${esc(e)} — check the deployment is "Anyone", you used the /exec URL, and you created a NEW deployment after the last Code.gs edit.</span>`; }
};
let ctx; function beep() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 1200; g.gain.value = .25; o.start(); o.stop(ctx.currentTime + .15); } catch (e) {} }

function onScan(text) { const n = Date.now(); if (text === lastScan && n - lastAt < 3000) return; lastScan = text; lastAt = n; beep(); handle(text, 'Barcode'); }
async function handle(id, method) {
  if (busy || !sessionId) return; busy = true; show('', 'Looking up…', '');
  try {
    const l = await api('lookup', { student_id: id });
    if (!l.success || !l.data.found) { show('err', 'Not recognized', `No student matches "${esc(id)}"`); busy = false; return; }
    const a = await api('recordAttendance', { student_id: l.data.student_id, session_id: sessionId, entry_method: method, recorded_by: by });
    if (!a.success) show('err', 'Error', esc(a.error));
    else if (a.data.status === 'duplicate') show('dup', l.data.name, `Already recorded at ${a.data.time}`);
    else if (a.data.status === 'error') show('err', 'Could not save', esc(a.data.message));
    else {
      const d = a.data;
      show(d.was_default ? '' : 'warn', d.student_name, `${d.is_late ? `<span style="color:#f59e0b">+${d.delay_minutes} min late</span>` : '<span style="color:#4ade80">On time</span>'} · ${esc(d.courses_covered)}${d.was_default ? '' : `<div class="flag">⚠️ Usual group ${d.student_group_id} — recorded as visiting</div>`}`, d.whatsapp, d.parent1_name);
      history.unshift({ name: d.student_name, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      document.getElementById('hist').style.display = 'block';
      document.getElementById('histList').innerHTML = history.slice(0, 30).map((h) => `<div class="h"><span>${esc(h.name)}</span><span style="color:#64748b">${h.time}</span></div>`).join('');
    }
  } catch (e) { show('err', 'Network error', esc(e) + ' — tap Test connection.'); }
  busy = false;
}
function show(cls, who, st, wa, pname) {
  const b = document.getElementById('box'); b.className = 'box' + (cls ? ' ' + cls : ''); b.style.display = 'block';
  document.getElementById('who').textContent = who; document.getElementById('st').innerHTML = st;
  document.getElementById('waWrap').innerHTML = wa ? `<a class="wa" href="${wa}" target="_blank">Send WhatsApp to ${esc(pname || 'parent')}</a>` : '';
}
const combo = document.getElementById('combo'); let t;
combo.addEventListener('input', () => { clearTimeout(t); t = setTimeout(async () => {
  if (!combo.value) return (document.getElementById('sug').innerHTML = '');
  const r = await api('suggest', { query: combo.value, group_id: groupId });
  if (r.success) document.getElementById('sug').innerHTML = r.data.map((s) => `<div class="s ${s.in_group ? '' : 'cross'}" onclick="pick('${s.student_id}')"><div><b>${esc(s.name)}</b><div style="font-size:12px;color:#94a3b8">${s.student_id}</div></div>${s.in_group ? '' : `<span class="tag">${s.group_id} · visiting</span>`}</div>`).join('');
}, 200); });
combo.addEventListener('keydown', (e) => { if (e.key === 'Enter' && combo.value.trim()) { handle(combo.value.trim(), 'Manual'); combo.value = ''; document.getElementById('sug').innerHTML = ''; } });
function pick(id) { combo.value = ''; document.getElementById('sug').innerHTML = ''; handle(id, 'Manual'); }

new Html5Qrcode('reader').start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 }, onScan)
  .catch((err) => show('err', 'Camera error', esc(err) + ' — allow camera access for this site in your browser settings.'));
</script>
</body>
</html>
